server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Soporte para rutas de Angular (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El frontend llama al backend en /api/v1/*; en producción normalmente
    # esto se resuelve con un reverse proxy delante de ambos contenedores.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
