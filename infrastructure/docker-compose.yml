# ============================================================================
# infrastructure/docker-compose.yml
#
# Levanta TODA la plataforma con un solo comando: PostgreSQL + backend +
# frontend. Es la forma recomendada de correr VamCore, incluso para
# desarrollo local — no necesitas instalar Java, Node ni PostgreSQL en tu
# máquina, solo Docker.
#
# Todos los nombres/puertos se parametrizan vía infrastructure/.env
# (copia infrastructure/.env.example -> infrastructure/.env y ajusta).
# ============================================================================
name: ${COMPOSE_PROJECT_NAME:-vamcore}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-vamcore}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${VAMCORE_DB_NAME:-vamcore}
      POSTGRES_USER: ${VAMCORE_DB_USER:-vamcore}
      POSTGRES_PASSWORD: ${VAMCORE_DB_PASSWORD:-vamcore}
    ports:
      - "${VAMCORE_DB_PORT:-5432}:5432"
    volumes:
      - vamcore_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${VAMCORE_DB_USER:-vamcore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - vamcore_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-vamcore}-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      VAMCORE_APP_NAME: ${VAMCORE_APP_NAME:-vamcore-backend}
      VAMCORE_DB_URL: jdbc:postgresql://postgres:5432/${VAMCORE_DB_NAME:-vamcore}
      VAMCORE_DB_USER: ${VAMCORE_DB_USER:-vamcore}
      VAMCORE_DB_PASSWORD: ${VAMCORE_DB_PASSWORD:-vamcore}
      VAMCORE_SERVER_PORT: ${VAMCORE_SERVER_PORT:-8080}
      VAMCORE_PLATFORM_NAME: ${VAMCORE_PLATFORM_NAME:-VamCore}
      VAMCORE_COMPANY_NAME: ${VAMCORE_COMPANY_NAME:-Codevam}
      VAMCORE_JWT_SECRET: ${VAMCORE_JWT_SECRET:-change-this-secret-in-every-environment-please}
      VAMCORE_JWT_EXPIRATION_MINUTES: ${VAMCORE_JWT_EXPIRATION_MINUTES:-60}
      VAMCORE_FILES_STORAGE_PATH: /app/storage
      VAMCORE_MAX_FILE_SIZE: ${VAMCORE_MAX_FILE_SIZE:-10MB}
    ports:
      - "${VAMCORE_SERVER_PORT:-8080}:8080"
    volumes:
      - vamcore_files_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - vamcore_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-vamcore}-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${VAMCORE_FRONTEND_PORT:-4200}:80"
    networks:
      - vamcore_net

networks:
  vamcore_net:
    name: ${COMPOSE_PROJECT_NAME:-vamcore}_net

volumes:
  vamcore_pg_data:
    name: ${COMPOSE_PROJECT_NAME:-vamcore}_pg_data
  vamcore_files_data:
    name: ${COMPOSE_PROJECT_NAME:-vamcore}_files_data
